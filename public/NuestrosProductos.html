    <!-- Script -->
    <script>
        //Lista de productos
        const productos = [
            ["Alas", 2100, "Alas.avif", "Alas de pollo frescas en Pollos Pako San Carlos Costa Rica"],
            ["Pechuga", 2325, "Pechuga.avif", "Pechuga de pollo fresca ideal para cocinar en casa en San Carlos Costa Rica"],
            ["Muslo entero", 1300, "MusloEntero.avif", "Muslo y cuarto de pollo fresco listo para preparar en Pollos Pako"],
            ["Muslo real", 2375, "MusloReal.avif", "Muslo real de pollo fresco en San Carlos Costa Rica"],
            ["Muslito de ala", 2525, "MuslitoDeAla.avif", "Muslito de ala de pollo fresco perfecto para freír en casa"],
            ["Pollo limpio", 2100, "PolloLimpio.avif", "Pollo entero limpio y fresco listo para cocinar en Pollos Pako San Carlos"],
            ["Filet de muslo", 3725, "FiletDeMuslo.avif", "Filete de muslo de pollo fresco y sin hueso en San Carlos Costa Rica"],
            ["Filet de pechuga", 3940, "FiletDePechuga.avif", "Filete de pechuga de pollo fresco ideal para comidas saludables"],
            ["Trozos", 1620, "Trozos.avif", "Trozos de pollo frescos para cocinar en casa en Pollos Pako"],
            ["Hígados", 1515, "Hígados.avif", "Hígados de pollo frescos para recetas tradicionales en San Carlos"],
            ["Mollejas", 1620, "Mollejas.avif", "Mollejas de pollo frescas ideales para guisos caseros"],
            ["Patas", 710, "Patas.avif", "Patas de pollo frescas para sopas y caldos en Pollos Pako"],
            ["Pescuezo", 600, "Pescuezos.avif", "Pescuezo de pollo fresco perfecto para caldos caseros"],
            ["Menudos", 600, "Menudos.avif", "Menudos de pollo frescos para preparar sopas tradicionales"],
            ["Carcasa", 500, "Carcasa.avif", "Carcasa de pollo fresca ideal para hacer caldo casero"]
        ];

        const contenedor = document.getElementById("contenedorProductos");

        //Se guardan los productos aunque el usuario cierre la pagina
        let carrito = JSON.parse(localStorage.getItem("carrito")) || {};

        //actualiza contador flotante
        function actualizarContador() {

            let total = 0;

            for (let producto in carrito) {
                total += carrito[producto].cantidad;
            }

            document.getElementById("contadorCarrito").textContent = total;
        }

        //contador inicial
        actualizarContador();

        //se generan dinamicamente las cards
        contenedor.innerHTML = productos.map(producto => `
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow">
                <img src="Img/${producto[2]}" class="card-img-top" alt="${producto[3]}" loading="lazy">
                
                <div class="card-body text-center">
                    <h5>${producto[0]}</h5>
                    <p>₡${producto[1]} kg</p>
                    
                    <div class="d-flex justify-content-center gap-2">
                        <input type="number" min="1" value="1" class="form-control cantidad" style="width:80px;">
                        <button class="btn btn-primary agregar"
                            data-precio="${producto[1]}"
                            data-nombre="${producto[0]}"
                            data-imagen="${producto[2]}">
                            Agregar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        `).join("");

        //verifica si el click fue en el botón agregar
        document.addEventListener("click", function (e) {
            if (e.target.classList.contains("agregar")) {

                const precio = parseInt(e.target.dataset.precio);
                const nombre = e.target.dataset.nombre;
                const imagen = e.target.dataset.imagen;

                const input = e.target.parentElement.querySelector(".cantidad");
                let cantidad = parseInt(input.value);

                if (isNaN(cantidad) || cantidad <= 0) {
                    cantidad = 1;
                }

                if (!carrito[nombre]) {
                    carrito[nombre] = {
                        cantidad: 0,
                        precio: precio,
                        imagen: imagen
                    };
                }

                //suma la cantidad
                carrito[nombre].cantidad += cantidad;

                //lo guarda en el localstorage
                localStorage.setItem("carrito", JSON.stringify(carrito));

                actualizarContador();

                //reinicia el input
                input.value = 1;

                mostrarMensaje(`${nombre} agregado al carrito`);
            }
        });

        //muestra una notificacion flotante
        function mostrarMensaje(texto) {
            const toast = document.createElement("div");

            toast.className = "toast-carrito";
            toast.innerHTML = `✅ ${texto}`;

            //lo inserta en el body
            document.body.appendChild(toast);

            //animacion
            setTimeout(() => {
                toast.classList.add("mostrar");
            }, 100);

            //lo oculta despues de segundo y medio
            setTimeout(() => {
                toast.classList.remove("mostrar");

                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 1500);
        }

        
    </script>
